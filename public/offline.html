<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Platewise</title>
    <style>
      :root {
        color-scheme: light dark;
        --page: #f6f5f1;
        --ink: #0b0b0b;
        --muted: #7a7873;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #0d0d0d;
          --ink: #ffffff;
          --muted: #8f8d86;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--page);
        color: var(--ink);
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      main { max-width: 320px; }
      svg { width: 48px; height: 48px; }
      h1 { margin: 20px 0 6px; font-size: 20px; letter-spacing: -0.01em; }
      p { margin: 0; color: var(--muted); }
      button {
        margin-top: 24px;
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 12px 16px;
        background: var(--ink);
        color: var(--page);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <!-- data-retry is filled with the app URL for the Android app (scripts/prepare-mobile.mjs). -->
  <body data-retry="/">
    <main>
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="currentColor" />
        <circle cx="16" cy="16" r="8.5" fill="none" stroke="var(--page)" stroke-opacity="0.3" stroke-width="3" />
        <circle cx="16" cy="16" r="2.25" fill="var(--page)" />
      </svg>
      <h1>You’re offline</h1>
      <p>Platewise needs a connection to estimate meals and sync your log. Check your internet and try again.</p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      const retry = () => window.location.replace(document.body.dataset.retry || '/')
      document.getElementById('retry').addEventListener('click', retry)
      window.addEventListener('online', retry)
    </script>
  </body>
</html>
